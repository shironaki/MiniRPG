<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#05070c">

    <title>Shadow Ascension</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">

        <div id="playerInfo">

            <div id="playerName">
                SHADOW HUNTER
            </div>

            <div class="level">
                LV. <span id="levelValue">1</span>
            </div>

            <div class="bar hpBar">
                <div id="hpFill"></div>
            </div>

            <div class="bar xpBar">
                <div id="xpFill"></div>
            </div>

            <div id="statsText">
                HP 100 / 100
            </div>

        </div>

        <div id="locationInfo">
            DUNGEON 01
        </div>

    </div>


    <!-- CENTER MESSAGE -->
    <div id="centerMessage"></div>


    <!-- MOBILE CONTROLS -->
    <div id="mobileControls">

    <div
        id="joystick"
        class="controlJoystick moveJoystick"
    >
        <div id="joystickKnob"></div>
    </div>


    <div
        id="aimJoystick"
        class="controlJoystick aimJoystick"
    >
        <div id="aimJoystickKnob"></div>
    </div>


    <div id="actionButtons">

        <button
            id="attackButton"
            class="actionButton attack"
        >
            ⚔
        </button>

        <button
                id="dodgeButton"
                class="actionButton dodge"
            >
            ◈
            </button>

        </div>

    </div>


    <!-- DESKTOP HELP -->
    <div id="desktopHelp">
        WASD / ↑↓←→ — движение &nbsp;&nbsp; SPACE — рывок &nbsp;&nbsp; ЛКМ — атака
    </div>

</div>


<script src="js/input.js"></script>
<script src="js/camera.js"></script>
<script src="js/gameLoop.js"></script>
<script src="js/player.js"></script>
<script src="js/effects.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
